<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get in Touch</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#fff0f5,#ffe4e1);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .form-container{
            width:100%;
            max-width:650px;
            background:#fff;
            padding:35px;
            border-radius:20px;
            border:2px solid #d4af37;
            box-shadow:0 8px 25px rgba(212,175,55,.3);
        }

        h2{
            text-align:center;
            color:#d4af37;
            font-size:40px;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#c2185b;
            margin-bottom:25px;
        }

        .row{
            display:flex;
            gap:15px;
        }

        .form-group{
            display:flex;
            flex-direction:column;
            flex:1;
            margin-bottom:18px;
        }

        label{
            color:#c2185b;
            font-size:14px;
            font-weight:bold;
            margin-bottom:6px;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:12px;
            border:2px solid #f8c8dc;
            border-radius:10px;
            transition:.3s;
        }

        input:hover,
        select:hover,
        textarea:hover{
            border-color:#ff69b4;
        }

        input:focus,
        select:focus,
        textarea:focus{
            outline:none;
            border-color:#d4af37;
            box-shadow:0 0 10px rgba(212,175,55,.5);
        }

        input:active,
        select:active,
        textarea:active{
            transform:scale(.99);
        }

        textarea{
            height:120px;
            resize:vertical;
            text-align:center;
        }

        .checkbox-group{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:20px;
        }

        .checkbox-group input{
            width:auto;
        }

        button{
            width:100%;
            padding:14px;
            background:linear-gradient(135deg,#ff69b4,#d4af37);
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:linear-gradient(135deg,#ff1493,#ffd700);
            transform:translateY(-3px);
        }

        button:active{
            transform:scale(.95);
        }

        @media(max-width:768px){
            .row{
                flex-direction:column;
            }

            h2{
                font-size:32px;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Get in Touch</h2>
        <p>Fill out the form below and we'll get back to you.</p>

        <form>

            <div class="row">
                <div class="form-group">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" placeholder="Angel">
                </div>

                <div class="form-group">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" placeholder="Mallari">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="angel@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="+639626839110">
            </div>

            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" placeholder="Soleil Ugc">
            </div>

            <div class="form-group">
                <label for="website">Website</label>
                <input type="url" id="website" placeholder="https://example.com">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                </div>

                <div class="form-group">
                    <label for="budget">Budget</label>
                    <input type="number" id="budget" placeholder="1000">
                </div>
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <select id="country">
                    <option selected disabled>Select a country</option>
                    <option>Korea</option>
                    <option>Paris</option>
                    <option>Switzerland</option>
              </select>
            </div>

            <div class="form-group">
                <label for="topic">Topic</label>
                <select id="topic">
                    <option selected disabled>Choose a topic</option>
                    <option>General Inquiry</option>
                    <option>Support</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Tell us more..."></textarea>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the terms and conditions</label>
            </div>

            <button type="submit">Submit</button>

        </form>
    </div>

</body>
</html>
